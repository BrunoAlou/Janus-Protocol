<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Janus Base Report</title>
    <style>
      :root {
        --bg: #f4f6f9;
        --panel: #ffffff;
        --text: #1f2a37;
        --muted: #6b7280;
        --line: #dde4ee;
        --accent: #0d6efd;
        --high: #0f766e;
        --medium: #b45309;
        --low: #b91c1c;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background: radial-gradient(circle at top left, #eef7ff, var(--bg) 45%);
        color: var(--text);
      }

      .toolbar {
        position: sticky;
        top: 0;
        z-index: 20;
        background: rgba(255, 255, 255, 0.92);
        border-bottom: 1px solid var(--line);
        backdrop-filter: blur(8px);
        padding: 12px 20px;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      .modes {
        display: inline-flex;
        gap: 8px;
      }

      .mode-btn {
        border: 1px solid var(--line);
        background: #fff;
        color: var(--text);
        border-radius: 999px;
        padding: 8px 14px;
        cursor: pointer;
        font-weight: 600;
      }

      .mode-btn.active {
        border-color: var(--accent);
        color: var(--accent);
        box-shadow: 0 0 0 2px rgba(13, 110, 253, 0.15);
      }

      .container {
        max-width: 1080px;
        margin: 0 auto;
        padding: 22px;
      }

      .top h1 {
        margin: 0;
        font-size: 30px;
      }

      .subtitle {
        margin-top: 6px;
        color: var(--muted);
      }

      .coverage {
        margin: 14px 0 20px;
        padding: 10px 14px;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: #fff;
        font-weight: 600;
      }

      .card {
        margin: 14px 0;
        border: 1px solid var(--line);
        border-radius: 14px;
        background: var(--panel);
        overflow: hidden;
      }

      .card-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 1px solid var(--line);
        padding: 14px 16px;
      }

      .card-header h2 {
        margin: 0;
        font-size: 20px;
      }

      .card-body {
        padding: 14px 16px;
      }

      .tier {
        padding: 4px 10px;
        border-radius: 999px;
        color: #fff;
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.2px;
      }

      .tier.high { background: var(--high); }
      .tier.medium { background: var(--medium); }
      .tier.low { background: var(--low); }

      .muted {
        color: var(--muted);
      }

      .badge-row {
        border: 1px dashed var(--line);
        border-radius: 10px;
        padding: 10px 12px;
        margin: 8px 0;
      }

      .badge-row p {
        margin: 6px 0 0;
        color: var(--muted);
      }

      .json {
        max-height: 340px;
        overflow: auto;
        background: #0f172a;
        color: #dbeafe;
        border-radius: 10px;
        padding: 12px;
        font-size: 12px;
        line-height: 1.5;
      }

      @media (max-width: 720px) {
        .toolbar {
          flex-direction: column;
          align-items: flex-start;
          gap: 8px;
        }

        .container {
          padding: 14px;
        }
      }
    </style>
  </head>
  <body>
    <div class="toolbar">
      <strong>Comparador de visualizacao do report</strong>
      <div class="modes">
        <button id="mode-prod" class="mode-btn">PROD</button>
        <button id="mode-debug" class="mode-btn">DEBUG</button>
      </div>
    </div>

    <main class="container" id="report-root"></main>

    <script type="module" src="/src/report/main.js"></script>
  </body>
</html>
